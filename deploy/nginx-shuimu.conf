# nginx site config for the 暗海探秘 web client.
# Static files are served from shuimu.apodfg.com; the leaderboard API lives on
# smallballgame.apodfg.com.
#
# Two ways to wire the API (pick one):
#   A) Cross-origin (default in config.js): leave apiBase pointing at
#      https://smallballgame.apodfg.com. The API already returns CORS headers
#      (see merge_jellyfish_server/app.py). No /api block needed here.
#   B) Same-origin proxy (no CORS): uncomment the /api block below AND set
#      apiBase to "/api" in config.js. Requests then go shuimu -> shuimu/api ->
#      backend, same origin from the browser's point of view.

server {
    listen 80;
    server_name shuimu.apodfg.com;

    # --- static site ---
    root /www/wwwroot/shuimu.apodfg.com;   # adjust to your deploy path
    index index.html;

    # HTML / entry config must not be cached aggressively (so updates ship)
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /config.js  { add_header Cache-Control "no-cache"; }

    # hashed-ish static assets can be cached for a long time
    location /assets/ { add_header Cache-Control "public, max-age=2592000"; try_files $uri =404; }
    location /vendor/ { add_header Cache-Control "public, max-age=2592000"; try_files $uri =404; }
    location /src/    { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # .ttc font needs a sane mime type + CORS for @font-face when proxied
    location ~* \.ttc$ {
        types { font/collection ttc; }
        add_header Cache-Control "public, max-age=2592000";
        add_header Access-Control-Allow-Origin "*";
    }

    location / { try_files $uri $uri/ /index.html; }

    # --- OPTION B: same-origin API proxy (uncomment + set apiBase:"/api") ---
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8000/api/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
